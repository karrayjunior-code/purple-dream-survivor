<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Purple Dream Survivor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=VT323&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0418;font-family:'VT323',monospace;color:#f3e9ff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #c{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;display:block}
  #hud{position:fixed;inset:0;pointer-events:none}
  #xpbar{position:fixed;top:0;left:0;right:0;height:14px;background:#1b0b33;border-bottom:1px solid #6b3fd6}
  #xpfill{height:100%;width:0;background:linear-gradient(90deg,#7b3cff,#4ff0ff);box-shadow:0 0 8px #8b5cff}
  .top{position:fixed;top:20px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;font-size:22px;text-shadow:0 0 6px #7a3cff,0 2px 0 #000}
  #hpbar{width:150px;height:12px;background:#2a0d18;border:1px solid #ff5c8a;margin-top:4px}
  #hpfill{height:100%;width:100%;background:linear-gradient(90deg,#ff2a6a,#ff8ab0)}
  .mid{text-align:center;position:absolute;left:50%;top:0;transform:translateX(-50%)}
  #timer{font-size:32px;line-height:1}
  #bosswrap{margin-top:6px;display:none}
  #bossname{font-size:18px;color:#ffc46b}
  #bossbar{width:min(300px,44vw);height:10px;background:#2a1205;border:1px solid #ffb04a;margin:2px auto 0}
  #bossfill{height:100%;width:100%;background:linear-gradient(90deg,#ff5a00,#ffd36b)}
  .right{text-align:right}
  #pauseBtn{pointer-events:auto;margin-top:6px;font-family:inherit;font-size:20px;background:rgba(40,15,80,.7);color:#e9d8ff;border:1px solid #8b5cff;border-radius:6px;padding:0 10px;cursor:pointer}
  #powers{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:95vw}
  .pw{background:rgba(30,10,60,.75);border:1px solid #8b5cff;border-radius:6px;padding:1px 7px;font-size:19px;white-space:nowrap}
  #joy{position:fixed;width:110px;height:110px;border-radius:50%;border:2px solid rgba(190,160,255,.5);background:rgba(120,70,255,.12);display:none;pointer-events:none;transform:translate(-50%,-50%)}
  #knob{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(200,170,255,.55);box-shadow:0 0 12px #a37bff}
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(60,20,120,.78),rgba(5,0,15,.93));text-align:center;padding:20px;gap:12px;box-sizing:border-box;overflow:auto}
  .hidden{display:none!important}
  h1{font-family:'Cinzel Decorative',serif;font-weight:900;font-size:clamp(34px,8vw,66px);margin:0;color:#e9d8ff;text-shadow:0 0 18px #9b5cff,0 0 40px #5b2cff,0 4px 0 #2a0a55;line-height:1.05}
  h2{font-family:'Cinzel Decorative',serif;font-size:clamp(24px,5vw,40px);margin:0;color:#ffe27a;text-shadow:0 0 14px #b06bff,0 3px 0 #000}
  .sub{font-size:22px;color:#c9b5ff;max-width:560px;line-height:1.15}
  .btn{pointer-events:auto;font-family:inherit;font-size:30px;color:#fff;background:linear-gradient(#8b4cff,#4a1aa8);border:2px solid #d4bcff;border-radius:10px;padding:8px 38px;box-shadow:0 0 18px #7b3cff;cursor:pointer}
  .btn:active{transform:scale(.96)}
  #cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:820px}
  .card{pointer-events:auto;width:220px;background:linear-gradient(#2b1260,#140630);border:2px solid #9b6bff;border-radius:12px;padding:14px;cursor:pointer;color:#f3e9ff;font-family:inherit;text-align:left;box-shadow:0 0 14px rgba(140,90,255,.5)}
  .card:hover{border-color:#ffe27a;box-shadow:0 0 22px rgba(255,220,120,.6)}
  .card .ic{font-size:38px;line-height:1}
  .card .nm{font-size:25px;color:#ffe27a;line-height:1}
  .card .lv{font-size:18px;color:#7ff3ff}
  .card .ds{font-size:19px;line-height:1.1;margin-top:4px}
  .card .new{color:#7dff9a}
  @media (max-width:640px){
    .card{width:86vw;padding:9px 12px;display:flex;gap:12px;align-items:center}
    .card .ic{font-size:34px}
  }
  #banner{position:fixed;top:24%;left:0;right:0;text-align:center;font-family:'Cinzel Decorative',serif;font-size:clamp(20px,4.6vw,38px);color:#ffd36b;text-shadow:0 0 14px #ff5a00,0 3px 0 #000;opacity:0;transition:opacity .4s;pointer-events:none;padding:0 12px}
  #dmgflash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px rgba(255,0,60,.85);opacity:0;transition:opacity .25s}
  .stats{font-size:26px;line-height:1.3}
  .stats b{color:#ffe27a}
  .keys{font-size:19px;color:#a993e0}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="xpbar"><div id="xpfill"></div></div>
  <div class="top">
    <div>
      <div>Nv <span id="lvl">1</span></div>
      <div id="hpbar"><div id="hpfill"></div></div>
    </div>
    <div class="mid">
      <div id="timer">00:00</div>
      <div id="bosswrap"><div id="bossname">☀ El Sol con Cara</div><div id="bossbar"><div id="bossfill"></div></div></div>
    </div>
    <div class="right">
      <div>💀 <span id="kills">0</span></div>
      <button id="pauseBtn">⏸</button>
    </div>
  </div>
  <div id="powers"></div>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="banner"></div>
<div id="dmgflash"></div>

<div id="start" class="overlay">
  <h1>Purple Dream<br>Survivor</h1>
  <div class="sub">Eres un mago perdido en un sueño morado. Tus hechizos se lanzan solos: tú solo esquiva y sobrevive.</div>
  <button class="btn" id="playBtn">Jugar</button>
  <div class="keys">PC: WASD o flechas · Móvil: arrastra el dedo · P: pausa</div>
  <div class="keys" id="best"></div>
</div>

<div id="levelup" class="overlay hidden">
  <h2>¡Subes de nivel!</h2>
  <div class="sub">Elige un poder</div>
  <div id="cards"></div>
</div>

<div id="pause" class="overlay hidden">
  <h2>Pausa</h2>
  <button class="btn" id="resumeBtn">Seguir</button>
</div>

<div id="over" class="overlay hidden">
  <h1>Has despertado…</h1>
  <div class="stats" id="overStats"></div>
  <button class="btn" id="againBtn">Otra vez</button>
</div>

<script src="vendor/three.min.js"></script>
<script>
(() => {
const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const TAU = Math.PI * 2;

// ---------- Renderer / escena ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14062b);
scene.fog = new THREE.Fog(0x24104a, 30, 72);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 200);
let portrait = false;
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setPixelRatio(Math.max(0.5, Math.min(devicePixelRatio || 1, 2) * 0.5));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  portrait = w < h;
  camera.fov = portrait ? 58 : 50;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

scene.add(new THREE.HemisphereLight(0x8a6bff, 0x1f3a12, 0.8));
const sunL = new THREE.DirectionalLight(0xffd9a8, 0.55); sunL.position.set(-10, 20, 8); scene.add(sunL);
const bossLight = new THREE.PointLight(0xff6a1a, 0, 18); scene.add(bossLight);

// ---------- Texturas generadas ----------
function canvasTex(size, draw, rep) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.magFilter = THREE.NearestFilter;
  if (rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep, rep); }
  return t;
}
const groundTex = canvasTex(256, (g, s) => {
  g.fillStyle = '#2a1450'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 260; i++) { g.fillStyle = `rgba(${rand(20,60)|0},${rand(60,110)|0},${rand(30,60)|0},0.22)`; g.beginPath(); g.arc(rand(0,s), rand(0,s), rand(4,18), 0, TAU); g.fill(); }
  for (let i = 0; i < 160; i++) { g.fillStyle = 'rgba(100,40,170,0.22)'; g.beginPath(); g.arc(rand(0,s), rand(0,s), rand(4,16), 0, TAU); g.fill(); }
  g.strokeStyle = '#8a7bff'; g.lineWidth = 2; g.shadowColor = '#b9abff'; g.shadowBlur = 6;
  for (let v = 0; v < 12; v++) {
    let x = rand(0, s), y = rand(0, s), a = rand(0, TAU);
    g.beginPath(); g.moveTo(x, y);
    for (let k = 0; k < 28; k++) { a += rand(-0.8, 0.8); x += Math.cos(a) * 6; y += Math.sin(a) * 6; g.lineTo(x, y); }
    g.stroke();
  }
}, 30);
const starTex = canvasTex(128, (g, s) => {
  g.fillStyle = '#1d1f7a'; g.fillRect(0, 0, s, s);
  for (let i = 0; i < 45; i++) { g.fillStyle = pick(['#ffe66b', '#ffffff', '#b9a3ff']); const x = rand(0,s), y = rand(0,s), r = rand(1,3); g.fillRect(x - r, y - 0.6, r * 2, 1.2); g.fillRect(x - 0.6, y - r, 1.2, r * 2); }
});
const checkerTex = canvasTex(64, (g, s) => {
  const n = 8, c = s / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { g.fillStyle = (i + j) % 2 ? '#f2f0ff' : '#0b0620'; g.fillRect(i * c, j * c, c, c); }
});
const spiralTex = canvasTex(256, (g, s) => {
  const cx = s / 2;
  const grd = g.createRadialGradient(cx, cx, 0, cx, cx, cx);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.2, 'rgba(170,140,255,0.9)'); grd.addColorStop(0.6, 'rgba(70,30,200,0.4)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = grd; g.fillRect(0, 0, s, s);
  for (let arm = 0; arm < 3; arm++) for (let i = 0; i < 420; i++) {
    const r = i / 420 * cx * 0.95, a = arm * TAU / 3 + r * 0.055 + rand(-0.15, 0.15);
    g.fillStyle = `rgba(${200 + rand(0,55)|0},${200 + rand(0,55)|0},255,${0.9 - i / 520})`;
    g.fillRect(cx + Math.cos(a) * r, cx + Math.sin(a) * r, 2, 2);
  }
});

// ---------- Geometrías y materiales compartidos ----------
const G = {
  sph: new THREE.SphereGeometry(1, 10, 8),
  cone: new THREE.ConeGeometry(1, 1, 8),
  cone6: new THREE.ConeGeometry(1, 1, 6),
  cyl: new THREE.CylinderGeometry(1, 1, 1, 8),
  cyl4: new THREE.CylinderGeometry(1, 1, 1, 4),
  box: new THREE.BoxGeometry(1, 1, 1),
  oct: new THREE.OctahedronGeometry(1, 0),
  half: new THREE.SphereGeometry(1, 10, 6, 0, TAU, 0, Math.PI / 2),
  plane: new THREE.PlaneGeometry(1, 1),
  circle: new THREE.CircleGeometry(1, 32),
  ring: new THREE.RingGeometry(0.8, 1, 32),
};
const mat = (c, e = 0x000000, o = {}) => new THREE.MeshPhongMaterial(Object.assign({ color: c, emissive: e, flatShading: true, shininess: 25, specular: 0x442266 }, o));
const M = {
  robe: mat(0xffffff, 0x0a0a30, { map: starTex }), skin: mat(0xf0c09a), beard: mat(0xeeeeff, 0x222233), staff: mat(0x6b4226), orb: mat(0x88ffff, 0x33ccff),
  goblin: mat(0x3f8a2a, 0x0b2205), gEye: mat(0xffdd33, 0xff5500),
  bone: mat(0xe8dcc0, 0x222018), socket: mat(0x110011, 0x9933ff),
  flesh: mat(0xe88b86, 0x401010), white: mat(0xffffff, 0x333333), iris: mat(0xc98a1a, 0x402000), black: mat(0x050505),
  red: mat(0xc81e1e, 0x300000), silver: mat(0xb8c0d8, 0x202030, { shininess: 90 }), green: mat(0x33ff66, 0x22ff55),
  gBody: mat(0x3048b8), nose: mat(0xff8a8a, 0x401818), hats: [mat(0x241a6e), mat(0x7a1a6e), mat(0x1a6e4a), mat(0xb8a020)],
  sun: mat(0xff6a1a, 0xaa2a00), ray: mat(0xffc21a, 0xff7a00), lip: mat(0xd0202a, 0x400000),
  moon: mat(0xfff1c0, 0x8a7020), eyeOrb: mat(0xffffff, 0x6655ff),
  bolt: new THREE.MeshBasicMaterial({ color: 0x9ff3ff }), ebolt: new THREE.MeshBasicMaterial({ color: 0xff5533 }),
  gem: [mat(0xb070ff, 0x6020c0), mat(0x40e0ff, 0x1080a0), mat(0xffd040, 0xa07000)], heal: mat(0xff3355, 0xa00020),
  shroomCap: mat(0x7dff6a, 0x2a9a20), shroomStem: mat(0xf0e6d0),
  mushCap: mat(0x5a2fa8, 0x2a0a60), mushStem: mat(0xe8dcc8, 0x201820), spot: mat(0xffffff, 0x8888ff),
  trunk: mat(0x3a2a3a), stone: mat(0x6d6a9a), roof: mat(0x2b2f7a), window: mat(0xffcc33, 0xffaa00), crystal: mat(0x55e0ff, 0x2080c0, { shininess: 90 }),
};
function part(geo, m, sx, sy, sz, x, y, z, parent) {
  const me = new THREE.Mesh(geo, m); me.scale.set(sx, sy, sz); me.position.set(x, y, z); parent.add(me); return me;
}

// ---------- Mundo ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshLambertMaterial({ map: groundTex, emissiveMap: groundTex, emissive: 0x3a2470 }));
ground.rotation.x = -Math.PI / 2; scene.add(ground);
for (let i = 0; i < 10; i++) {
  const s = rand(6, 14);
  const p = new THREE.Mesh(G.plane, new THREE.MeshLambertMaterial({ map: checkerTex, emissiveMap: checkerTex, emissive: 0x332266 }));
  p.scale.set(s, s, 1); p.rotation.x = -Math.PI / 2; p.rotation.z = rand(0, TAU);
  const a = rand(0, TAU), d = rand(25, 160); p.position.set(Math.cos(a) * d, 0.02, Math.sin(a) * d); scene.add(p);
}
function decor() {
  for (let i = 0; i < 150; i++) {
    const a = rand(0, TAU), d = rand(14, 175), x = Math.cos(a) * d, z = Math.sin(a) * d;
    const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = rand(0, TAU);
    const r = Math.random();
    if (r < 0.45) {
      part(G.cyl, M.mushStem, 0.15, 0.8, 0.15, 0, 0.4, 0, g);
      part(G.half, M.mushCap, 0.6, 0.45, 0.6, 0, 0.75, 0, g);
      for (let k = 0; k < 4; k++) { const b = rand(0, TAU); part(G.sph, M.spot, 0.08, 0.06, 0.08, Math.cos(b) * 0.4, 1.0, Math.sin(b) * 0.4, g); }
      g.scale.setScalar(rand(0.8, 2.4));
    } else if (r < 0.75) {
      part(G.cyl, M.trunk, 0.3, 3.2, 0.3, 0, 1.6, 0, g);
      for (let k = 0; k < 3; k++) { const br = part(G.cyl, M.trunk, 0.1, 1.6, 0.1, 0, 2.4 + k * 0.4, 0, g); br.rotation.z = rand(0.6, 1.1) * (k % 2 ? 1 : -1); br.rotation.y = rand(0, TAU); }
      g.scale.setScalar(rand(0.9, 1.6));
    } else if (r < 0.87) {
      part(G.cyl, M.stone, 1.3, 6, 1.3, 0, 3, 0, g);
      part(G.cone, M.roof, 1.7, 2.4, 1.7, 0, 7.2, 0, g);
      for (let k = 0; k < 3; k++) part(G.box, M.window, 0.35, 0.55, 0.1, rand(-0.5, 0.5), 1.5 + k * 1.6, 1.3, g);
    } else {
      const c = part(G.oct, M.crystal, 0.5, 1.4, 0.5, 0, 1.2, 0, g); c.rotation.z = rand(-0.3, 0.3);
      g.scale.setScalar(rand(0.7, 1.6));
    }
    scene.add(g);
  }
}
decor();

// Partículas flotantes
const SPN = 400, spPos = new Float32Array(SPN * 3);
for (let i = 0; i < SPN; i++) { spPos[i * 3] = rand(-45, 45); spPos[i * 3 + 1] = rand(0.3, 7); spPos[i * 3 + 2] = rand(-45, 45); }
const spGeo = new THREE.BufferGeometry(); spGeo.setAttribute('position', new THREE.BufferAttribute(spPos, 3));
const sparkles = new THREE.Points(spGeo, new THREE.PointsMaterial({ size: 0.2, color: 0xc9b5ff, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(sparkles);

// ---------- Personajes ----------
function buildPlayer() {
  const g = new THREE.Group();
  part(G.cone, M.robe, 0.75, 1.7, 0.75, 0, 0.85, 0, g);
  part(G.sph, M.skin, 0.3, 0.32, 0.3, 0, 1.85, 0, g);
  const b = part(G.cone6, M.beard, 0.26, 0.7, 0.2, 0, 1.5, 0.18, g); b.rotation.x = Math.PI;
  part(G.cyl, M.robe, 0.78, 0.05, 0.78, 0, 2.08, 0, g);
  const hat = part(G.cone, M.robe, 0.48, 1.4, 0.48, 0, 2.75, -0.08, g); hat.rotation.x = -0.2;
  part(G.cyl, M.staff, 0.05, 2.4, 0.05, 0.6, 1.2, 0.25, g);
  part(G.oct, M.orb, 0.18, 0.18, 0.18, 0.6, 2.5, 0.25, g);
  const l = new THREE.PointLight(0xa070ff, 1.6, 12); l.position.set(0, 2.5, 0); g.add(l);
  return g;
}
const B = {
  goblin() {
    const g = new THREE.Group();
    part(G.sph, M.goblin, 0.42, 0.45, 0.38, 0, 0.55, 0, g);
    part(G.sph, M.goblin, 0.36, 0.33, 0.34, 0, 1.15, 0.05, g);
    const e1 = part(G.cone6, M.goblin, 0.1, 0.55, 0.1, 0.42, 1.25, 0, g); e1.rotation.z = -1.3;
    const e2 = part(G.cone6, M.goblin, 0.1, 0.55, 0.1, -0.42, 1.25, 0, g); e2.rotation.z = 1.3;
    part(G.sph, M.gEye, 0.08, 0.06, 0.05, 0.13, 1.2, 0.33, g); part(G.sph, M.gEye, 0.08, 0.06, 0.05, -0.13, 1.2, 0.33, g);
    part(G.box, M.white, 0.3, 0.06, 0.05, 0, 1.03, 0.36, g);
    return g;
  },
  skeleton() {
    const g = new THREE.Group();
    part(G.box, M.bone, 0.12, 0.75, 0.12, 0, 1.0, 0, g);
    for (let i = 0; i < 3; i++) part(G.box, M.bone, 0.55 - i * 0.08, 0.06, 0.25, 0, 1.25 - i * 0.15, 0, g);
    part(G.box, M.bone, 0.42, 0.12, 0.2, 0, 0.64, 0, g);
    part(G.box, M.bone, 0.1, 0.62, 0.1, 0.14, 0.31, 0, g); part(G.box, M.bone, 0.1, 0.62, 0.1, -0.14, 0.31, 0, g);
    const a1 = part(G.box, M.bone, 0.08, 0.6, 0.08, 0.36, 1.05, 0.1, g); a1.rotation.z = 0.25; a1.rotation.x = -0.6;
    const a2 = part(G.box, M.bone, 0.08, 0.6, 0.08, -0.36, 1.05, 0.1, g); a2.rotation.z = -0.25; a2.rotation.x = -0.6;
    part(G.sph, M.bone, 0.27, 0.28, 0.27, 0, 1.62, 0, g);
    part(G.box, M.bone, 0.3, 0.08, 0.2, 0, 1.42, 0.06, g);
    part(G.sph, M.socket, 0.07, 0.07, 0.05, 0.1, 1.65, 0.23, g); part(G.sph, M.socket, 0.07, 0.07, 0.05, -0.1, 1.65, 0.23, g);
    return g;
  },
  eye() {
    const g = new THREE.Group(), h = new THREE.Group(); h.position.y = 1.7; g.add(h); g.userData.float = h; g.userData.fy = 1.7;
    part(G.sph, M.flesh, 0.6, 0.5, 0.55, 0, 0, 0, h);
    part(G.sph, M.white, 0.45, 0.32, 0.3, 0, 0, 0.33, h);
    part(G.sph, M.iris, 0.2, 0.2, 0.1, 0, 0, 0.6, h);
    part(G.sph, M.black, 0.09, 0.09, 0.06, 0, 0, 0.67, h);
    return g;
  },
  hooded() {
    const g = new THREE.Group();
    part(G.cone, M.red, 0.6, 1.5, 0.6, 0, 0.75, 0, g);
    part(G.cone, M.red, 0.85, 0.5, 0.85, 0, 0.25, 0, g);
    part(G.cone6, M.silver, 0.32, 0.9, 0.32, 0, 1.85, 0, g);
    part(G.cone6, M.silver, 0.05, 0.8, 0.05, 0, 2.6, 0, g);

  for (let i = portals.length - 1; i >= 0; i--) {
    const p = portals[i]; p.life -= dt; p.tick -= dt;
    const k = p.life / p.max; p.mesh.scale.setScalar(p.r * 1.3 * Math.min(1, (1 - k) * 5, k * 4)); p.mesh.rotation.z += dt * 4;
    for (const e of enemiesNear(p.x, p.z, p.r * 1.7)) {
      if (e.def.boss) continue;
      const dx = p.x - e.g.position.x, dz = p.z - e.g.position.z, d = Math.hypot(dx, dz) || 1;
      e.g.position.x += dx / d * Math.min(d, 6 * dt); e.g.position.z += dz / d * Math.min(d, 6 * dt);
    }
    if (p.tick <= 0) { p.tick = 0.25; hurtArea(p.x, p.z, p.r, p.dmg); }
    if (p.life <= 0) { scene.remove(p.mesh); p.mesh.material.dispose(); portals.splice(i, 1); }
  }
  // Tormenta morada
  if (pl.storm) {
    W.stormT -= dt;
    if (W.stormT <= 0) {
      W.stormT = Math.max(0.7, 2.4 - 0.3 * pl.storm) * cdm;
      const c = enemiesNear(P.pos.x, P.pos.z, 15), n = 1 + Math.floor(pl.storm / 2);
      for (let i = 0; i < n && c.length; i++) {
        const e = c.splice(Math.floor(Math.random() * c.length), 1)[0], x = e.g.position.x, z = e.g.position.z;
        lightning(x, z); hurtArea(x, z, 1.3, (12 + 7 * pl.storm) * dm);
      }
    }
  }
  // Champiñón de ácido
  if (pl.shroom) {
    W.shroomT -= dt;
    if (W.shroomT <= 0) {
      W.shroomT = Math.max(1.4, 4 - 0.45 * pl.shroom) * cdm;
      const g = new THREE.Group(); part(G.cyl, M.shroomStem, 0.12, 0.4, 0.12, 0, 0.2, 0, g); part(G.half, M.shroomCap, 0.42, 0.35, 0.42, 0, 0.38, 0, g);
      const x = P.pos.x + rand(-1.5, 1.5), z = P.pos.z + rand(-1.5, 1.5); g.position.set(x, 0, z); scene.add(g);
      shrooms.push({ mesh: g, x, z, fuse: 1.2, r: 2.4 + 0.4 * pl.shroom, dmg: (16 + 9 * pl.shroom) * dm });
    }
  }
  for (let i = shrooms.length - 1; i >= 0; i--) {
    const s = shrooms[i]; s.fuse -= dt; s.mesh.scale.setScalar(1 + (1.2 - s.fuse) * 0.6 + Math.sin(time * 30) * 0.05);
    if (s.fuse <= 0) {
      hurtArea(s.x, s.z, s.r, s.dmg);
      const b = new THREE.Mesh(G.sph, basicMat(0x66ff44, 0.6, true)); b.position.set(s.x, 0.3, s.z); b.scale.setScalar(0.4); addFx(b, 0.35, s.r, 0.6);
      scene.remove(s.mesh); shrooms.splice(i, 1);
    }
  }
}

// ---------- Subida de nivel ----------
function addXP(v) {
  P.xp += v;
  while (P.xp >= P.next) { P.xp -= P.next; P.lvl++; P.next = Math.floor(6 + P.lvl * 4 + P.lvl * P.lvl * 0.3); pendingLv++; }
  if (pendingLv > 0 && state === 'play') openLevelUp();
}
let curOpts = [];
function openLevelUp() {
  state = 'levelup'; hideJoy();
  const pool = [];
  for (const k in POWERS) { const l = P.powers[k] || 0; if (l < POWERS[k].max) pool.push({ kind: 'power', key: k, lvl: l + 1 }); }
  for (const k in PASSIVES) { const l = P.passives[k] || 0; if (l < PASSIVES[k].max) pool.push({ kind: 'passive', key: k, lvl: l + 1 }); }
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  curOpts = pool.slice(0, 3); if (!curOpts.length) curOpts = [{ kind: 'heal' }];
  const box = $('cards'); box.innerHTML = '';
  curOpts.forEach((o, i) => {
    let ic, nm, lv, ds;
    if (o.kind === 'heal') { ic = '🧪'; nm = 'Poción de sueño'; lv = ''; ds = 'Recupera 30 de vida.'; }
    else {
      const d = o.kind === 'power' ? POWERS[o.key] : PASSIVES[o.key]; ic = d.ic; nm = d.name;
      lv = o.lvl === 1 ? '<span class="new">¡Nuevo!</span>' : 'Nv ' + o.lvl;
      ds = o.kind === 'power' && o.lvl > 1 ? d.up : d.desc;
    }
    const b = document.createElement('button'); b.className = 'card';
    b.innerHTML = `<div class="ic">${ic}</div><div><div class="nm">${nm}</div><div class="lv">${lv}</div><div class="ds">${ds}</div></div>`;
    b.onclick = () => choose(i); box.appendChild(b);
  });
  $('levelup').classList.remove('hidden');
}
function choose(i) {
  const o = curOpts[i]; if (!o) return;
  if (o.kind === 'power') P.powers[o.key] = o.lvl;
  else if (o.kind === 'passive') { P.passives[o.key] = o.lvl; if (o.key === 'vit') { P.maxHp += 20; P.hp = P.maxHp; } }
  else P.hp = Math.min(P.maxHp, P.hp + 30);
  syncPowerMeshes(); renderPowers();
  pendingLv--;
  $('levelup').classList.add('hidden');
  if (pendingLv > 0) openLevelUp(); else state = 'play';
}
function renderPowers() {
  const box = $('powers'); box.innerHTML = '';
  for (const k in P.powers) box.insertAdjacentHTML('beforeend', `<div class="pw">${POWERS[k].ic} ${P.powers[k]}</div>`);
  for (const k in P.passives) box.insertAdjacentHTML('beforeend', `<div class="pw">${PASSIVES[k].ic} ${P.passives[k]}</div>`);
  syncPowerMeshes();
}

// ---------- Mensajes ----------
let bannerT = 0;
function banner(txt, dur = 2.5) { const b = $('banner'); b.textContent = txt; b.style.opacity = 1; bannerT = dur; }

// ---------- Controles ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (state === 'levelup' && ['1', '2', '3'].includes(e.key)) choose(+e.key - 1);
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && (state === 'play' || state === 'pause')) togglePause();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
function hideJoy() { joy.id = null; joy.x = joy.y = 0; $('joy').style.display = 'none'; }
canvas.addEventListener('pointerdown', e => {
  if (state !== 'play' || joy.id !== null) return;
  joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = joy.y = 0;
  const j = $('joy'); j.style.left = e.clientX + 'px'; j.style.top = e.clientY + 'px'; j.style.display = 'block'; $('knob').style.transform = '';
});
addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const d = Math.hypot(dx, dy), max = 50;
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  joy.x = dx / max; joy.y = dy / max; $('knob').style.transform = `translate(${dx}px,${dy}px)`;
});
const endJoy = e => { if (e.pointerId === joy.id) hideJoy(); };
addEventListener('pointerup', endJoy); addEventListener('pointercancel', endJoy);

function togglePause() {
  if (state === 'play') { state = 'pause'; hideJoy(); $('pause').classList.remove('hidden'); }
  else if (state === 'pause') { state = 'play'; $('pause').classList.add('hidden'); }
}
$('pauseBtn').onclick = () => { if (state === 'play' || state === 'pause') togglePause(); };
$('resumeBtn').onclick = togglePause;
$('playBtn').onclick = () => { reset(); $('start').classList.add('hidden'); state = 'play'; banner('Sobrevive al sueño morado…'); };
$('againBtn').onclick = () => { reset(); $('over').classList.add('hidden'); state = 'play'; };
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

function fmt(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
function getBest() { try { return +localStorage.getItem('pds_best') || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem('pds_best', v); } catch (e) {} }
{ const b = getBest(); if (b) $('best').textContent = 'Mejor tiempo: ' + fmt(b); }

function gameOver() {
  state = 'over'; hideJoy();
  const best = Math.max(getBest(), time); setBest(best);
  $('overStats').innerHTML = `Tiempo: <b>${fmt(time)}</b><br>Nivel: <b>${P.lvl}</b><br>Enemigos: <b>${P.kills}</b><br>Mejor tiempo: <b>${fmt(best)}</b>`;
  $('over').classList.remove('hidden');
}

// ---------- Bucle principal ----------
function update(dt) {
  time += dt;
  while (waveIdx < WAVES.length && time >= WAVES[waveIdx].t) { banner(WAVES[waveIdx].msg); waveIdx++; }

  // Movimiento
  let mx = 0, mz = 0;
  if (keys.w || keys.arrowup) mz -= 1; if (keys.s || keys.arrowdown) mz += 1;
  if (keys.a || keys.arrowleft) mx -= 1; if (keys.d || keys.arrowright) mx += 1;
  mx += joy.x; mz += joy.y;
  const ml = Math.hypot(mx, mz); if (ml > 1) { mx /= ml; mz /= ml; }
  const sp = pSpeed();
  P.pos.x = Math.max(-180, Math.min(180, P.pos.x + mx * sp * dt));
  P.pos.z = Math.max(-180, Math.min(180, P.pos.z + mz * sp * dt));
  const moving = ml > 0.1;
  player.position.set(P.pos.x, moving ? Math.abs(Math.sin(time * 10)) * 0.15 : 0, P.pos.z);
  if (moving) { const target = Math.atan2(mx, mz); let dr = target - player.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); player.rotation.y += dr * Math.min(1, dt * 12); }
  player.visible = P.inv > 0 ? Math.floor(time * 20) % 2 === 0 : true;
  P.inv -= dt;

  // Aparición de enemigos
  spawnT -= dt;
  if (spawnT <= 0) {
    // Grupos que crecen con el tiempo; el tope de enemigos vivos sube poco a poco hasta 400
    const cap = Math.min(MAX_ENEMIES, 40 + time), n = 2 + Math.floor(time / 30);
    const a = rand(0, TAU), d = spawnDist(), cx = P.pos.x + Math.cos(a) * d, cz = P.pos.z + Math.sin(a) * d, spr = 1.5 + n * 0.3;
    for (let i = 0; i < n && enemies.length < cap; i++) spawnEnemy(chooseType(), cx + rand(-spr, spr), cz + rand(-spr, spr));
    spawnT = Math.max(0.45, 1.6 - time * 0.005);
  }
  if (!boss && time >= nextBoss) spawnBoss();

  // Enemigos
  for (const e of enemies) {
    if (e.dead) continue;
    const g = e.g, dx = P.pos.x - g.position.x, dz = P.pos.z - g.position.z, d = Math.hypot(dx, dz) || 0.001;
    if (d > 66 && !e.def.boss) { const a = rand(0, TAU), r = spawnDist(); g.position.set(P.pos.x + Math.cos(a) * r, 0, P.pos.z + Math.sin(a) * r); continue; }
    e.slow -= dt; e.moonCd -= dt;
    const s = e.speed * (e.slow > 0 ? 0.55 : 1);
    g.position.x += dx / d * s * dt; g.position.z += dz / d * s * dt;
    g.rotation.y = Math.atan2(dx, dz);
    if (e.def.boss) g.userData.float.position.y = g.userData.fy + Math.sin(time * 3 + e.ph) * 0.25;
    else if (RENDER[e.rk].float) e.fly = Math.sin(time * 3 + e.ph) * 0.25;
    else g.rotation.z = Math.sin(time * 10 + e.ph) * 0.08;
    if (e.hitT > 0) { e.hitT -= dt; g.scale.setScalar(e.sc * (1 + e.hitT * 2)); } else g.scale.setScalar(e.sc);
    if (d < e.r + 0.5 && P.inv <= 0) damagePlayer(e.dmg);
    if (e.def.shoots) { e.shootT -= dt; if (e.shootT <= 0 && d < 15) { enemyBolt(g.position.x, g.position.z, dx / d, dz / d, 7, 8); e.shootT = rand(2.5, 4); } }
    if (e.def.boss) {
      g.userData.rays.rotation.z += dt * 0.8;
      bossLight.position.set(g.position.x, 4, g.position.z);
      e.shootT -= dt;
      if (e.shootT <= 0) { e.shootT = 3; const off = rand(0, TAU); for (let i = 0; i < 14; i++) { const a = off + i / 14 * TAU; enemyBolt(g.position.x, g.position.z, Math.cos(a), Math.sin(a), 6, 12, 2); } }
      $('bossfill').style.width = Math.max(0, e.hp / e.maxHp * 100) + '%';
    }
  }
  // Separación para que no se amontonen (rejilla espacial: evita comparar todos con todos)
  sepGrid.clear();
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i]; if (e.dead || e.def.boss) continue;
    e.ci = i; e.cx = Math.floor(e.g.position.x / 1.25); e.cz = Math.floor(e.g.position.z / 1.25);
    const k = e.cx * 4096 + e.cz; let c = sepGrid.get(k); if (!c) { c = []; sepGrid.set(k, c); } c.push(e);
  }
  for (const a of enemies) {
    if (a.dead || a.def.boss) continue;
    for (let ox = -1; ox <= 1; ox++) for (let oz = -1; oz <= 1; oz++) {
      const c = sepGrid.get((a.cx + ox) * 4096 + a.cz + oz); if (!c) continue;
      for (const b of c) {
        if (b.ci <= a.ci) continue;
        const dx = b.g.position.x - a.g.position.x, dz = b.g.position.z - a.g.position.z, min = (a.r + b.r) * 0.9, d2 = dx * dx + dz * dz;
        if (d2 < min * min && d2 > 0.0001) { const d = Math.sqrt(d2), push = (min - d) * 0.5; a.g.position.x -= dx / d * push; a.g.position.z -= dz / d * push; b.g.position.x += dx / d * push; b.g.position.z += dz / d * push; }
      }
    }
  }

  updatePowers(dt);

  // Proyectiles
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i]; b.life -= dt; b.mesh.position.x += b.vx * dt; b.mesh.position.z += b.vz * dt;
    let dead = b.life <= 0;
    if (b.enemy) {
      const dx = P.pos.x - b.mesh.position.x, dz = P.pos.z - b.mesh.position.z;
      if (dx * dx + dz * dz < 0.45 && P.inv <= 0) { damagePlayer(b.dmg); dead = true; }
    } else {
      for (const e of enemies) {
        if (e.dead || b.hit.has(e)) continue;
        const dx = e.g.position.x - b.mesh.position.x, dz = e.g.position.z - b.mesh.position.z, rr = e.r + 0.25;
        if (dx * dx + dz * dz < rr * rr) { hurt(e, b.dmg); b.hit.add(e); if (b.pierce-- <= 0) { dead = true; break; } }
      }
    }
    if (dead) { scene.remove(b.mesh); bolts.splice(i, 1); }
  }

  // Cristales
  const mr = magnetR();
  for (let i = gems.length - 1; i >= 0; i--) {
    const gm = gems[i], m = gm.mesh; m.rotation.y += dt * 3; m.position.y = 0.7 + Math.sin(time * 4 + i) * 0.12;
    const dx = P.pos.x - m.position.x, dz = P.pos.z - m.position.z, d = Math.hypot(dx, dz);
    if (d < mr) gm.pull = true;
    if (gm.pull) { const s = Math.min(d, 16 * dt); m.position.x += dx / (d || 1) * s; m.position.z += dz / (d || 1) * s; }
    if (d < 0.7) {
      scene.remove(m); gems.splice(i, 1);
      if (gm.heal) P.hp = Math.min(P.maxHp, P.hp + gm.heal); else addXP(gm.val);
      if (state !== 'play') break;
    }
  }

  // Limpieza
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead) enemies.splice(i, 1);

  if (P.hp <= 0) gameOver();
}

function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.life -= dt; const k = Math.max(0, f.life / f.max);
    if (f.grow) f.obj.scale.setScalar(f.base + f.grow * (1 - k));
    const mats = f.obj.userData.mats || [f.obj.material];
    mats.forEach(m => { m.opacity = f.op * k; });
    if (f.life <= 0) { scene.remove(f.obj); mats.forEach(m => m.dispose()); fx.splice(i, 1); }
  }
  for (let i = 0; i < SPN; i++) {
    let x = spPos[i * 3], z = spPos[i * 3 + 2];
    spPos[i * 3 + 1] += Math.sin(time + i) * dt * 0.3;
    if (x - P.pos.x > 45) x -= 90; else if (x - P.pos.x < -45) x += 90;
    if (z - P.pos.z > 45) z -= 90; else if (z - P.pos.z < -45) z += 90;
    spPos[i * 3] = x; spPos[i * 3 + 2] = z;
  }
  spGeo.attributes.position.needsUpdate = true;
}

function updateHud() {
  $('hpfill').style.width = Math.max(0, P.hp / P.maxHp * 100) + '%';
  $('xpfill').style.width = (P.xp / P.next * 100) + '%';
  $('lvl').textContent = P.lvl; $('kills').textContent = P.kills; $('timer').textContent = fmt(time);
}

const camOff = new THREE.Vector3(), sepGrid = new Map();
let last = performance.now();
reset();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') { update(dt); updateHud(); }
  if (state === 'play' || state === 'start') updateFx(dt);
  if (state === 'start') { P.pos.x += dt * 1.2; P.pos.z -= dt * 0.6; player.position.copy(P.pos); player.rotation.y = Math.atan2(1.2, -0.6); }
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').style.opacity = 0; }
  camOff.set(0, portrait ? 31.5 : 24, portrait ? 19.5 : 16.5);
  camera.position.lerp(new THREE.Vector3(P.pos.x + camOff.x, camOff.y, P.pos.z + camOff.z), state === 'start' ? 1 : Math.min(1, dt * 8));
  camera.lookAt(P.pos.x, 0.5, P.pos.z);
  renderEnemies();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
