<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Purple Dream Survivor</title>
<style>
  @font-face{font-family:'Uncial';src:url(fonts/uncial-antiqua.woff2) format('woff2');font-display:swap}
  @font-face{font-family:'Pira';src:url(fonts/pirata-one.woff2) format('woff2');font-display:swap}
  @font-face{font-family:'Pix';src:url(fonts/vt323.woff2) format('woff2');font-display:swap}
  :root{--ink:#12041f;--deep:#1a0638;--plum:#2a0a52;--purple:#7a1cff;--violet:#b04aff;--lilac:#e2c4ff;--gold:#ffb300;--goldl:#fff08a;--blood:#b0001e;--red:#ff2a4a;--fire:#ff5a00;--acid:#8cff1a;--cyan:#3ef0ff;--elec:#1e5bff;
    --cut:polygon(6px 0,calc(100% - 6px) 0,100% 6px,100% calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,0 calc(100% - 6px),0 6px)}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:'Pix',monospace;color:var(--lilac);touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #c{position:fixed;inset:0;width:100vw;height:100vh;image-rendering:pixelated;display:block}
  .ico{width:1em;height:1em;display:inline-block;vertical-align:-0.15em;image-rendering:pixelated;flex:none}
  .hidden{display:none!important}

  /* Marco pixelado común: esquinas recortadas + doble borde con bisel */
  .frame{position:relative;background:linear-gradient(180deg,rgba(42,10,82,.94),rgba(18,4,31,.94));clip-path:var(--cut);
    box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 4px #5a22b4,inset 0 4px 0 4px rgba(226,196,255,.18),inset 0 -4px 0 4px rgba(0,0,0,.35)}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;pointer-events:none}
  #xpbar{position:fixed;top:0;left:0;right:0;height:10px;background:var(--ink);border-bottom:2px solid var(--ink);box-shadow:0 2px 0 #5a22b4}
  #xpfill{height:100%;width:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(18,4,31,.55) 9px 10px),linear-gradient(180deg,#9ffbff,var(--cyan) 40%,var(--elec));box-shadow:0 0 10px var(--cyan)}
  .top{position:fixed;top:16px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .hp{display:flex;align-items:center;gap:6px;padding:6px 10px 6px 8px}
  .hp .ico{width:22px;height:22px}
  .hpcol{display:flex;flex-direction:column;gap:3px}
  .lvl{font-size:18px;line-height:1;color:var(--goldl);text-shadow:0 2px 0 var(--ink)}
  .lvl b{font-family:'Pira';font-weight:400;font-size:19px}
  .bar{position:relative;height:10px;background:var(--ink);box-shadow:0 0 0 2px var(--ink),0 0 0 3px #5a22b4}
  .bar>div{height:100%;width:100%;transition:width .15s}
  #hpbar{width:clamp(96px,30vw,170px)}
  #hpfill{background:repeating-linear-gradient(90deg,transparent 0 7px,rgba(18,4,31,.6) 7px 8px),linear-gradient(180deg,#ff8aa0,var(--red) 35%,var(--blood))}
  .mid{position:absolute;left:50%;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center}
  #timer{font-size:34px;line-height:.9;color:#fff;letter-spacing:1px;text-shadow:0 0 10px var(--violet),0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink)}
  #bosswrap{margin-top:8px;display:none;text-align:center}
  #bossname{font-family:'Pira';font-size:21px;color:var(--goldl);text-shadow:0 0 8px var(--fire),0 2px 0 var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
  #bossname .ico{width:18px;height:18px}
  #bossbar{width:min(300px,46vw);height:12px;margin:5px auto 0;box-shadow:0 0 0 2px var(--ink),0 0 0 3px #ff8a2a,0 0 12px rgba(255,90,0,.6)}
  #bossfill{background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(18,4,31,.55) 11px 12px),linear-gradient(180deg,var(--goldl),var(--gold) 35%,var(--fire))}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .kills{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:24px;line-height:1;color:#fff}
  .kills .ico{width:20px;height:20px}
  #pauseBtn{pointer-events:auto;width:40px;height:40px;padding:0;border:0;cursor:pointer;display:grid;place-items:center;color:inherit}
  #pauseBtn .ico{width:26px;height:26px}
  #pauseBtn:active{transform:translateY(2px)}
  #powers{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:min(96vw,620px)}
  .pw{position:relative;width:38px;height:38px;display:grid;place-items:center}
  .pw .ico{width:24px;height:24px}
  .pw i{position:absolute;right:3px;bottom:1px;font-style:normal;font-size:15px;line-height:1;color:var(--goldl);text-shadow:1px 1px 0 var(--ink),-1px 0 0 var(--ink)}
  #joy{position:fixed;width:110px;height:110px;border-radius:50%;border:3px solid rgba(176,74,255,.55);background:radial-gradient(rgba(122,28,255,.18),rgba(18,4,31,.35));box-shadow:0 0 0 2px rgba(18,4,31,.6),inset 0 0 18px rgba(62,240,255,.25);display:none;pointer-events:none;transform:translate(-50%,-50%)}
  #knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,var(--lilac) 30%,var(--violet) 75%);box-shadow:0 0 0 3px var(--ink),0 0 14px var(--violet)}
  #banner{position:fixed;top:23%;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;text-align:center;font-family:'Pira';font-size:clamp(20px,4.4vw,34px);color:var(--goldl);text-shadow:0 0 14px var(--fire),0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink);opacity:0;transition:opacity .4s;pointer-events:none;padding:0 14px}
  #banner .ico{width:1.1em;height:1.1em;filter:drop-shadow(0 2px 0 var(--ink))}
  #dmgflash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 140px rgba(176,0,30,.9);opacity:0;transition:opacity .25s}

  /* ---------- Pantallas ---------- */
  .overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:14px;box-sizing:border-box;overflow:auto;
    background:radial-gradient(ellipse at 50% 45%,rgba(42,10,82,.55),rgba(18,4,31,.92) 75%)}
  h2{font-family:'Pira';font-weight:400;font-size:clamp(34px,7vw,54px);margin:0;line-height:1.05;color:transparent;background:linear-gradient(180deg,#fffbe0,var(--goldl) 40%,var(--gold) 60%,var(--fire));-webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 3px 0 #5a1400) drop-shadow(0 2px 0 var(--ink)) drop-shadow(0 0 14px rgba(255,90,0,.55))}
  .hint{font-size:20px;color:#b9a0e8;text-shadow:0 2px 0 var(--ink)}
  .btn{pointer-events:auto;font-family:'Pira';font-size:30px;color:var(--goldl);letter-spacing:1px;background:linear-gradient(180deg,#9a4cff,var(--purple) 45%,#4a0fa8);border:0;padding:12px 44px 14px;cursor:pointer;clip-path:var(--cut);
    box-shadow:inset 0 0 0 2px var(--ink),inset 0 3px 0 2px rgba(255,240,138,.35),inset 0 -4px 0 2px rgba(18,4,31,.55);text-shadow:0 2px 0 var(--ink),0 0 10px rgba(255,179,0,.6)}
  .btn:hover{filter:brightness(1.15)}
  .btn:active{transform:translateY(2px);box-shadow:inset 0 0 0 2px var(--ink),inset 0 -2px 0 2px rgba(255,240,138,.25),inset 0 4px 0 2px rgba(18,4,31,.55)}
  .btn:disabled{filter:grayscale(.6) brightness(.8);cursor:wait}

  /* Inicio: el mundo se ve detrás, solo una viñeta para leer el título */
  #start{justify-content:space-between;padding:clamp(28px,9vh,90px) 20px clamp(24px,7vh,64px);
    background:linear-gradient(180deg,rgba(18,4,31,.75),transparent 34%,transparent 62%,rgba(18,4,31,.8)),radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(18,4,31,.7))}
  .title{display:flex;flex-direction:column;align-items:center;gap:6px}
  h1{font-family:'Uncial';font-weight:400;margin:0;line-height:.95;color:transparent;background:linear-gradient(180deg,#ffffff,var(--lilac) 30%,var(--violet) 62%,#5a12c8);-webkit-background-clip:text;background-clip:text;
    filter:drop-shadow(0 3px 0 #3a0a7a) drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 0 22px rgba(176,74,255,.75))}
  h1 .l1{display:block;font-size:clamp(30px,8.5vw,64px)}
  h1 .l2{display:block;font-size:clamp(40px,12vw,92px);background:linear-gradient(180deg,#fffbe0,var(--goldl) 35%,var(--gold) 60%,var(--fire));-webkit-background-clip:text;background-clip:text}
  .orn{display:flex;align-items:center;gap:10px;width:min(320px,70vw);margin-top:4px}
  .orn:before,.orn:after{content:'';flex:1;height:2px;background:linear-gradient(90deg,transparent,var(--violet));box-shadow:0 2px 0 var(--ink)}
  .orn:after{background:linear-gradient(90deg,var(--violet),transparent)}
  .orn span{width:9px;height:9px;transform:rotate(45deg);background:var(--goldl);box-shadow:0 0 0 2px var(--ink),0 0 10px var(--gold)}
  .tag{font-size:21px;color:#cbb2f5;letter-spacing:1px;text-shadow:0 2px 0 var(--ink)}
  .startfoot{display:flex;flex-direction:column;align-items:center;gap:10px}
  #best{font-size:20px;color:var(--goldl);display:flex;align-items:center;gap:6px;text-shadow:0 2px 0 var(--ink)}
  #best:empty{display:none}

  /* Cartas de mejora */
  #cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;max-width:860px}
  .card{pointer-events:auto;width:230px;border:0;padding:16px 16px 18px;cursor:pointer;color:var(--lilac);font-family:inherit;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .12s}
  .card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 4px var(--gold),inset 0 4px 0 4px rgba(255,240,138,.25),inset 0 -4px 0 4px rgba(0,0,0,.35);outline:none}

  .card .nm{font-family:'Pira';font-size:25px;color:var(--goldl);line-height:1.05;text-shadow:0 2px 0 var(--ink)}

  .card .lv.new{color:var(--acid)}
  .card .ds{font-size:19px;line-height:1.1;color:#e8dcff}
  .card .key{position:absolute;top:8px;left:10px;font-size:15px;color:#8f74c8}
  @media (max-width:640px){
    .card{width:min(88vw,420px);flex-direction:row;text-align:left;padding:10px 14px;gap:12px}
    .card .tile{width:54px;height:54px}.card .tile .ico{width:40px;height:40px}
    .card .key{display:none}
  }

  /* Muerte */
  #over h2{font-size:clamp(34px,8vw,58px);background:linear-gradient(180deg,#ffd0d8,var(--red) 40%,var(--blood) 75%,#4a0010);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 3px 0 var(--ink)) drop-shadow(0 0 18px rgba(255,42,74,.55))}
  .stats{display:grid;grid-template-columns:auto auto;gap:6px 18px;padding:16px 22px;font-size:22px;text-align:left;align-items:center}
  .stats .k{display:flex;align-items:center;gap:8px;color:#cbb2f5}
  .stats .k .ico{width:20px;height:20px}
  .stats b{font-weight:400;color:var(--goldl);text-align:right;font-size:24px}
  .stats .rec{grid-column:1/-1;text-align:center;color:var(--acid);font-size:20px}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="xpbar"><div id="xpfill"></div></div>
  <div class="top">
    <div class="hp frame" id="hpbox">
      <span id="hpicon"></span>
      <div class="hpcol">
        <div class="lvl">Nivel <b id="lvl">1</b></div>
        <div id="hpbar" class="bar"><div id="hpfill"></div></div>
      </div>
    </div>
    <div class="mid">
      <div id="timer">00:00</div>
      <div id="bosswrap"><div id="bossname">Helioth</div><div id="bossbar" class="bar"><div id="bossfill"></div></div></div>
    </div>
    <div class="right">
      <div class="kills frame"><span id="killicon"></span><span id="kills">0</span></div>
      <button id="pauseBtn" class="frame" aria-label="Pausa"></button>
    </div>
  </div>
  <div id="powers"></div>
</div>
<div id="joy"><div id="knob"></div></div>
<div id="banner"></div>
<div id="dmgflash"></div>

<div id="start" class="overlay">
  <div class="title">
    <h1><span class="l1">Purple Dream</span><span class="l2">Survivor</span></h1>
    <div class="orn"><span></span></div>
    <div class="tag">un sueño del que no se despierta</div>
  </div>
  <div class="startfoot">
    <button class="btn" id="playBtn">Jugar</button>
    <div id="best"></div>
    <div class="hint">Muévete con WASD, flechas o arrastrando el dedo</div>
  </div>
</div>

<div id="levelup" class="overlay hidden">
  <h2>¡Subes de nivel!</h2>
  <div class="hint">Elige un don del sueño</div>
  <div id="cards"></div>
</div>

<div id="pause" class="overlay hidden">
  <h2>Pausa</h2>
  <button class="btn" id="resumeBtn">Seguir</button>
</div>

<div id="over" class="overlay hidden">
  <h2>Has despertado…</h2>
  <div class="stats frame" id="overStats"></div>
  <button class="btn" id="againBtn">Otra vez</button>
</div>

    if (o.kind === 'heal') { ic = 'heal'; nm = 'Poción de sueño'; lv = 'Curación'; ds = 'Recupera 30 de vida.'; }
    else {
      const d = o.kind === 'power' ? POWERS[o.key] : PASSIVES[o.key]; ic = d.ic; nm = d.name;
      isNew = o.lvl === 1; lv = isNew ? 'NUEVO' : 'Nivel ' + o.lvl + ' / ' + d.max;
      ds = o.kind === 'power' && o.lvl > 1 ? d.up : d.desc;
    }
    const b = document.createElement('button'); b.className = 'card frame';
    b.innerHTML = `<span class="key">${i + 1}</span><div class="tile">${icon(ic)}</div><div><div class="nm">${nm}</div><div class="lv${isNew ? ' new' : ''}">${lv}</div><div class="ds">${ds}</div></div>`;
    b.onclick = () => choose(i); box.appendChild(b);
  });
  $('levelup').classList.remove('hidden');
}
function choose(i) {
  const o = curOpts[i]; if (!o) return;
  if (o.kind === 'power') P.powers[o.key] = o.lvl;
  else if (o.kind === 'passive') { P.passives[o.key] = o.lvl; if (o.key === 'vit') { P.maxHp += 20; P.hp = P.maxHp; } }
  else P.hp = Math.min(P.maxHp, P.hp + 30);
  syncPowerMeshes(); renderPowers();
  pendingLv--;
  $('levelup').classList.add('hidden');
  if (pendingLv > 0) openLevelUp(); else state = 'play';
}
function renderPowers() {
  const box = $('powers'); box.innerHTML = '';
  for (const k in P.powers) box.insertAdjacentHTML('beforeend', `<div class="pw frame" title="${POWERS[k].name}">${icon(POWERS[k].ic)}<i>${P.powers[k]}</i></div>`);
  for (const k in P.passives) box.insertAdjacentHTML('beforeend', `<div class="pw frame" title="${PASSIVES[k].name}">${icon(PASSIVES[k].ic)}<i>${P.passives[k]}</i></div>`);
  syncPowerMeshes();
}

// ---------- Mensajes ----------
let bannerT = 0;
function banner(txt, dur = 2.5, ic) {
  const b = $('banner'); b.innerHTML = ''; const t = document.createElement('span'); t.textContent = txt;
  if (ic) b.insertAdjacentHTML('beforeend', icon(ic)); b.appendChild(t); if (ic) b.insertAdjacentHTML('beforeend', icon(ic));
  b.style.opacity = 1; bannerT = dur;
}

// ---------- Controles ----------
const keys = {};
addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (state === 'levelup' && ['1', '2', '3'].includes(e.key)) choose(+e.key - 1);
  if ((e.key === 'p' || e.key === 'P' || e.key === 'Escape') && (state === 'play' || state === 'pause')) togglePause();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const joy = { id: null, ox: 0, oy: 0, x: 0, y: 0 };
function hideJoy() { joy.id = null; joy.x = joy.y = 0; $('joy').style.display = 'none'; }
canvas.addEventListener('pointerdown', e => {
  if (state !== 'play' || joy.id !== null) return;
  joy.id = e.pointerId; joy.ox = e.clientX; joy.oy = e.clientY; joy.x = joy.y = 0;
  const j = $('joy'); j.style.left = e.clientX + 'px'; j.style.top = e.clientY + 'px'; j.style.display = 'block'; $('knob').style.transform = '';
});
addEventListener('pointermove', e => {
  if (e.pointerId !== joy.id) return;
  let dx = e.clientX - joy.ox, dy = e.clientY - joy.oy; const d = Math.hypot(dx, dy), max = 50;
  if (d > max) { dx = dx / d * max; dy = dy / d * max; }
  joy.x = dx / max; joy.y = dy / max; $('knob').style.transform = `translate(${dx}px,${dy}px)`;
});
const endJoy = e => { if (e.pointerId === joy.id) hideJoy(); };
addEventListener('pointerup', endJoy); addEventListener('pointercancel', endJoy);

function togglePause() {
  if (state === 'play') { state = 'pause'; hideJoy(); $('pause').classList.remove('hidden'); }
  else if (state === 'pause') { state = 'play'; $('pause').classList.add('hidden'); }
}
$('pauseBtn').onclick = () => { if (state === 'play' || state === 'pause') togglePause(); };
$('resumeBtn').onclick = togglePause;
// ---------- Carga de modelos ----------
{
  const btn = $('playBtn'), txt = btn.textContent, loader = new THREE.GLTFLoader();
  const load = url => new Promise((ok, ko) => loader.load(url, ok, undefined, ko));
  btn.disabled = true; btn.textContent = 'Cargando…';
  Promise.all(['models/mago.glb', 'models/esqueleto.glb', 'models/encapuchado.glb'].map(load)).then(([mg, sk, ho]) => {
    setupMage(mg);
    registerType('skeleton', bakeGltf(sk, 1.9, { vein: (r, g, b) => b > 0.6 && b > r * 1.1 }));   // huesos de piedra con venas eléctricas
    registerType('hooded', bakeGltf(ho, 2.2, { eyes: { x: 0.17, y: 0.42, z: 0.22, r: 0.11, color: PAL.acid } }));
    btn.disabled = false; btn.textContent = txt;
  }).catch(err => { console.error(err); btn.textContent = 'Error al cargar'; });
}
$('playBtn').onclick = () => { reset(); $('start').classList.add('hidden'); $('hud').classList.remove('hidden'); state = 'play'; banner('Sobrevive al sueño morado…'); };
$('againBtn').onclick = () => { reset(); $('over').classList.add('hidden'); state = 'play'; };
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play') togglePause(); });

function fmt(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0'); }
function getBest() { try { return +localStorage.getItem('pds_best') || 0; } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem('pds_best', v); } catch (e) {} }
{ const b = getBest(); if (b) $('best').innerHTML = icon('star') + 'Mejor sueño: ' + fmt(b); }

function gameOver() {
  state = 'over'; hideJoy(); player.visible = true; mageDie();
  const best = Math.max(getBest(), time); setBest(best);
  const row = (ic, k, v) => `<span class="k">${icon(ic)}${k}</span><b>${v}</b>`;
  $('overStats').innerHTML = row('haste', 'Tiempo', fmt(time)) + row('power', 'Nivel', P.lvl) + row('skull', 'Enemigos', P.kills) + row('star', 'Mejor sueño', fmt(best))
    + (time >= best && time > 1 ? '<span class="rec">¡Nuevo récord!</span>' : '');
  $('best').innerHTML = icon('star') + 'Mejor sueño: ' + fmt(best);
  $('over').classList.remove('hidden');
}

// ---------- Bucle principal ----------
function update(dt) {
  time += dt;
  while (waveIdx < WAVES.length && time >= WAVES[waveIdx].t) { banner(WAVES[waveIdx].msg, 2.5, WAVES[waveIdx].ic); waveIdx++; }

  // Movimiento
  let mx = 0, mz = 0;
  if (keys.w || keys.arrowup) mz -= 1; if (keys.s || keys.arrowdown) mz += 1;
  if (keys.a || keys.arrowleft) mx -= 1; if (keys.d || keys.arrowright) mx += 1;
  mx += joy.x; mz += joy.y;
  const ml = Math.hypot(mx, mz); if (ml > 1) { mx /= ml; mz /= ml; }
  const sp = pSpeed();
  P.pos.x = Math.max(-180, Math.min(180, P.pos.x + mx * sp * dt));
  P.pos.z = Math.max(-180, Math.min(180, P.pos.z + mz * sp * dt));
  const moving = ml > 0.1;
  player.position.set(P.pos.x, 0, P.pos.z); P.moving = moving;
  if (moving) { const target = Math.atan2(mx, mz); let dr = target - player.rotation.y; dr = Math.atan2(Math.sin(dr), Math.cos(dr)); player.rotation.y += dr * Math.min(1, dt * 12); }
  player.visible = P.inv > 0 ? Math.floor(time * 20) % 2 === 0 : true;
  P.inv -= dt;

  // Aparición de enemigos
  spawnT -= dt;
  if (spawnT <= 0) {
    // Grupos que crecen con el tiempo; el tope de enemigos vivos sube poco a poco hasta 400
    const cap = Math.min(MAX_ENEMIES, 40 + time), n = 2 + Math.floor(time / 30);
    const a = rand(0, TAU), d = spawnDist(), cx = P.pos.x + Math.cos(a) * d, cz = P.pos.z + Math.sin(a) * d, spr = 1.5 + n * 0.3;
    for (let i = 0; i < n && enemies.length < cap; i++) spawnEnemy(chooseType(), cx + rand(-spr, spr), cz + rand(-spr, spr));
    spawnT = Math.max(0.45, 1.6 - time * 0.005);
  }
  if (!boss && time >= nextBoss) spawnBoss();

  // Enemigos
  for (const e of enemies) {
    if (e.dead) continue;
    const g = e.g, dx = P.pos.x - g.position.x, dz = P.pos.z - g.position.z, d = Math.hypot(dx, dz) || 0.001;
    if (d > 66 && !e.def.boss) { const a = rand(0, TAU), r = spawnDist(); g.position.set(P.pos.x + Math.cos(a) * r, 0, P.pos.z + Math.sin(a) * r); continue; }
    e.slow -= dt; e.moonCd -= dt;
    const s = e.speed * (e.slow > 0 ? 0.55 : 1);
    g.position.x += dx / d * s * dt; g.position.z += dz / d * s * dt;
    g.rotation.y = Math.atan2(dx, dz);
    if (e.def.boss) {
      g.userData.float.position.y = g.userData.fy + Math.sin(time * 3 + e.ph) * 0.25;
      g.userData.mouth.scale.y = 0.5 + (e.shootT < 0.7 ? (0.7 - e.shootT) * 2.2 : 0);
      bossMat.emissive.setScalar(e.hitT > 0 ? 0.45 : 0);
    } else e.hitA -= dt;
    if (e.hitT > 0) { e.hitT -= dt; g.scale.setScalar(e.sc * (1 + e.hitT * 2)); } else g.scale.setScalar(e.sc);
    if (d < e.r + 0.5 && P.inv <= 0) damagePlayer(e.dmg);
    if (e.def.shoots) { e.shootT -= dt; if (e.shootT <= 0 && d < 15) { enemyBolt(g.position.x, g.position.z, dx / d, dz / d, 7, 8); e.shootT = rand(2.5, 4); } }
    if (e.def.boss) {
      g.userData.rays.rotation.z += dt * 0.8;
      bossLight.position.set(g.position.x, 4, g.position.z);
      e.shootT -= dt;
      if (e.shootT <= 0) { e.shootT = 3; const off = rand(0, TAU); for (let i = 0; i < 14; i++) { const a = off + i / 14 * TAU; enemyBolt(g.position.x, g.position.z, Math.cos(a), Math.sin(a), 6, 12, 2); } }
      $('bossfill').style.width = Math.max(0, e.hp / e.maxHp * 100) + '%';
    }
  }
  // Separación para que no se amontonen (rejilla espacial: evita comparar todos con todos)
  sepGrid.clear();
  for (let i = 0; i < enemies.length; i++) {
    const e = enemies[i]; if (e.dead || e.def.boss) continue;
    e.ci = i; e.cx = Math.floor(e.g.position.x / 1.25); e.cz = Math.floor(e.g.position.z / 1.25);
    const k = e.cx * 4096 + e.cz; let c = sepGrid.get(k); if (!c) { c = []; sepGrid.set(k, c); } c.push(e);
  }
  for (const a of enemies) {
    if (a.dead || a.def.boss) continue;
    for (let ox = -1; ox <= 1; ox++) for (let oz = -1; oz <= 1; oz++) {
      const c = sepGrid.get((a.cx + ox) * 4096 + a.cz + oz); if (!c) continue;
      for (const b of c) {
        if (b.ci <= a.ci) continue;
        const dx = b.g.position.x - a.g.position.x, dz = b.g.position.z - a.g.position.z, min = (a.r + b.r) * 0.9, d2 = dx * dx + dz * dz;
        if (d2 < min * min && d2 > 0.0001) { const d = Math.sqrt(d2), push = (min - d) * 0.5; a.g.position.x -= dx / d * push; a.g.position.z -= dz / d * push; b.g.position.x += dx / d * push; b.g.position.z += dz / d * push; }
      }
    }
  }

  updatePowers(dt);

  // Proyectiles
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i]; b.life -= dt; b.mesh.position.x += b.vx * dt; b.mesh.position.z += b.vz * dt;
    let dead = b.life <= 0;
    if (b.enemy) {
      const dx = P.pos.x - b.mesh.position.x, dz = P.pos.z - b.mesh.position.z;
      if (dx * dx + dz * dz < 0.45 && P.inv <= 0) { damagePlayer(b.dmg); dead = true; }
    } else {
      for (const e of enemies) {
        if (e.dead || b.hit.has(e)) continue;
        const dx = e.g.position.x - b.mesh.position.x, dz = e.g.position.z - b.mesh.position.z, rr = e.r + 0.25;
        if (dx * dx + dz * dz < rr * rr) { hurt(e, b.dmg); b.hit.add(e); if (b.pierce-- <= 0) { dead = true; break; } }
      }
    }
    if (dead) { scene.remove(b.mesh); bolts.splice(i, 1); }
  }

  // Cristales
  const mr = magnetR();
  for (let i = gems.length - 1; i >= 0; i--) {
    const gm = gems[i], m = gm.mesh; m.rotation.y += dt * 3; m.position.y = 0.7 + Math.sin(time * 4 + i) * 0.12;
    const dx = P.pos.x - m.position.x, dz = P.pos.z - m.position.z, d = Math.hypot(dx, dz);
    if (d < mr) gm.pull = true;
    if (gm.pull) { const s = Math.min(d, 16 * dt); m.position.x += dx / (d || 1) * s; m.position.z += dz / (d || 1) * s; }
    if (d < 0.7) {
      scene.remove(m); gems.splice(i, 1);
      if (gm.heal) P.hp = Math.min(P.maxHp, P.hp + gm.heal); else addXP(gm.val);
      if (state !== 'play') break;
    }
  }

  updateCorpses(dt);

  // Limpieza
  for (let i = enemies.length - 1; i >= 0; i--) if (enemies[i].dead) enemies.splice(i, 1);

  if (P.hp <= 0) gameOver();
}

function updateFx(dt) {
  for (let i = fx.length - 1; i >= 0; i--) {
    const f = fx[i]; f.life -= dt; const k = Math.max(0, f.life / f.max);
    if (f.grow) f.obj.scale.setScalar(f.base + f.grow * (1 - k));
    const mats = f.obj.userData.mats || [f.obj.material];
    mats.forEach(m => { m.opacity = f.op * k; });
    if (f.life <= 0) { scene.remove(f.obj); mats.forEach(m => m.dispose()); fx.splice(i, 1); }
  }
  for (let i = 0; i < SPN; i++) {
    let x = spPos[i * 3], z = spPos[i * 3 + 2];
    spPos[i * 3 + 1] += Math.sin(time + i) * dt * 0.3;
    if (x - P.pos.x > 45) x -= 90; else if (x - P.pos.x < -45) x += 90;
    if (z - P.pos.z > 45) z -= 90; else if (z - P.pos.z < -45) z += 90;
    spPos[i * 3] = x; spPos[i * 3 + 2] = z;
  }
  spGeo.attributes.position.needsUpdate = true;
}

function updateHud() {
  $('hpfill').style.width = Math.max(0, P.hp / P.maxHp * 100) + '%';
  $('xpfill').style.width = (P.xp / P.next * 100) + '%';
  $('lvl').textContent = P.lvl; $('kills').textContent = P.kills; $('timer').textContent = fmt(time);
}

const camOff = new THREE.Vector3(), sepGrid = new Map();
let last = performance.now();
reset();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (state === 'play') { update(dt); updateHud(); }
  if (state === 'play' || state === 'start') updateFx(dt);
  if (state === 'start') {   // menú: el mago recorre el sueño en un gran círculo
    const a = now * 0.00007; P.pos.set(Math.cos(a) * 38, 0, Math.sin(a) * 38);
    player.position.copy(P.pos); player.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a));
  }
  if (state === 'play' || state === 'start' || state === 'over') mageAnim(dt, state === 'start' || (state === 'play' && P.moving));
  if (bannerT > 0) { bannerT -= dt; if (bannerT <= 0) $('banner').style.opacity = 0; }
  if (state === 'start') { const b = now * 0.00012, r = portrait ? 10 : 8.5; camOff.set(Math.sin(b) * r, portrait ? 5 : 4.2, Math.cos(b) * r); }   // cámara de cine lenta
  else camOff.set(0, portrait ? 31.5 : 24, portrait ? 19.5 : 16.5);
  camera.position.lerp(new THREE.Vector3(P.pos.x + camOff.x, camOff.y, P.pos.z + camOff.z), state === 'start' ? 1 : Math.min(1, dt * 8));
  camera.lookAt(P.pos.x, state === 'start' ? 1.5 : 0.5, P.pos.z);
  renderEnemies();
  renderFrame(now / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
